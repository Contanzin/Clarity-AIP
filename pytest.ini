[pytest]
asyncio_mode = auto
; app/core/database.py cria um único engine assíncrono no import do módulo,
; vinculado ao event loop ativo no momento. Sem isso, cada teste ganharia
; um event loop novo e o asyncpg quebraria com "another operation is in
; progress" ao reusar conexões do engine antigo.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
