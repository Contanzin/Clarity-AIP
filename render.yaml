databases:
  - name: clarity-aip-db
    plan: free
    databaseName: clarity_aip
    user: clarity_user

services:
  - type: web
    name: clarity-aip
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clarity-aip-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: APP_ENV
        value: production
